name: Build Wheels
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  # Build the wheels by hand on any branch from the Actions tab
  workflow_dispatch:

# The build only needs to read the repository. Only the release job for a tag writes, see below.
permissions:
  contents: read

jobs:
  wheels:
    # CPython wheels with the C extension. The settings are in pyproject.toml, [tool.cibuildwheel].
    name: Wheels on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-x86_64
            os: macos-15-intel
          - name: macos-arm64
            os: macos-15
          - name: windows
            os: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Build and check the wheels
        uses: pypa/cibuildwheel@v4.3.3
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl

  pure:
    # PyPy and Python versions without a wheel above use this wheel. On PyPy, UltraDict uses cffi.
    name: Pure Python wheel and source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install PyPy
        uses: actions/setup-python@v7
        with:
          python-version: pypy3.11
      - name: Build the wheel and the source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the wheel
        # The wheel must not contain the C extension
        run: |
          ls dist
          test -f dist/ultradict-*-py3-none-any.whl
          python -m pip install psutil dist/ultradict-*-py3-none-any.whl
          cd /tmp && python $GITHUB_WORKSPACE/tests/wheel_check.py
      - uses: actions/upload-artifact@v7
        with:
          name: pure
          path: dist/*

  release:
    # Push a tag like v0.1.0 to attach the wheels and the source distribution to a GitHub release
    name: Attach the wheels to the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, pure]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Check that the version matches the tag
        run: |
          ls dist
          ls dist/ultradict-${GITHUB_REF_NAME#v}.tar.gz
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
