name: Run Python Tests
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  # Run the tests by hand on any branch from the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: Test on ${{ matrix.config.name }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "linux-x86_64"
            os: ubuntu-24.04
            arch: x64
          - name: "linux-aarch64"
            os: ubuntu-24.04-arm
            arch: arm64
          - name: "macos-x86_64"
            os: macos-15-intel
            arch: x64
          - name: "macos-arm64"
            os: macos-15
            arch: arm64
          - name: "win-amd64"
            os: windows-2025
            arch: x64
          - name: "win32-x86"
            os: windows-2025
            arch: x86
        # Run in all these versions of Python
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Install Python ${{ matrix.python-version }}
        # v7 removes end-of-life Python versions, this matrix still tests 3.8 and 3.9
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.config.arch }}
      - name: Display Python version
        run: python -c "import sys, platform; print(sys.version, platform.machine())"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Manually install psutils as long as we don't build the wheels
          pip install psutil
          # Manually install pylint as long as we don't build the wheels
          #pip install pylint
      - name: Run unit tests without the C extension
        run: python -m unittest
        env:
          ULTRADICT_PURE_PYTHON: 1
      - name: Build the C extension
        run: |
          pip install cython setuptools
          cythonize -3 -i _fast.pyx
          python -c "import sys; sys.path.insert(0, '..'); from UltraDict import UltraDict; assert UltraDict.accelerated"
      - name: Run unit tests with the C extension
        run: python -m unittest
          #- name: Run pylint
          #run: pylint UltraDict.py
